# Operator-reviewed, opt-in bootstrap. NOT applied by this session.
# RBAC cannot constrain namespace creation by label/name prefix. Use a dedicated
# personal cluster, trusted controller and one writer; this is not tenant isolation.
apiVersion: v1
kind: Namespace
metadata:
  name: imageharbor-control
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: imageharbor-controller
  namespace: imageharbor-control
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: imageharbor-controller
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, watch, create, update]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update]
  - apiGroups: [""]
    resources: [services, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, delete]
  - apiGroups: [traefik.io]
    resources: [ingressroutes, middlewares]
    verbs: [get, list, watch, create, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: imageharbor-controller
subjects:
  - kind: ServiceAccount
    name: imageharbor-controller
    namespace: imageharbor-control
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: imageharbor-controller
