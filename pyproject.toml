[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "imageharbor"
version = "0.1.0"
description = "A small, image-first personal Kubernetes control plane"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
imageharbor = "imageharbor.cli:main"

[tool.setuptools.packages.find]
include = ["imageharbor*"]
